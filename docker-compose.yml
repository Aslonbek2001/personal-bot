services:
  bot:
    build: .
    container_name: ustoz-bot
    env_file: .env
    environment:
      TZ: Asia/Tashkent
    volumes:
      - ./content:/app/content:ro
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
